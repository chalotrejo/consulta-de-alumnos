<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Nuevo Alumno</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; background-image: url('Pink Glow GIF by xponentialdesign.gif'); background-size: cover; background-position: center; background-repeat: no-repeat; height: 100vh; box-sizing: border-box;">
  
  <h2 style="color: #ffffff; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Registro de Alumnos</h2>
  
  <form action="registro.php" method="POST" style="background-color: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; width: 100%; max-width: 350px; box-sizing: border-box;">
    
    <div style="margin-bottom: 16px;">
      <label for="matricula" style="display: block; font-size: 14px; font-weight: bold; color: #555; margin-bottom: 8px;">Matrícula:</label>
      <input type="text" id="matricula" name="matricula" required placeholder="Ej. A202602" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 20px;">
      <label for="nombre" style="display: block; font-size: 14px; font-weight: bold; color: #555; margin-bottom: 8px;">Nombre Completo:</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana Gómez" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; box-sizing: border-box;">
    </div>
    
    <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold;">Guardar Alumno</button>
  
  </form>
  
  <a href="index.html" style="margin-top: 20px; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">← Volver a Consulta</a>

</body>
</html>
